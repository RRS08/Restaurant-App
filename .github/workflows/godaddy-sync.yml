# ----------------------------------------------------------------
# GoDaddy Poynt near-live sync — external cron
#
# Vercel Hobby caps its own Cron Jobs at once-per-day, which
# isn't enough for a "near-live" sales feed. GitHub Actions gets
# us free scheduled runs at whatever cadence we want, hitting
# our own /api/cron/godaddy-sync endpoint over HTTPS with the
# CRON_SECRET header the route already verifies.
#
# GitHub schedules cron on their infra — a plain workflow_dispatch
# button is also included so we can hit "Run workflow" from the
# Actions tab whenever we want to sync on-demand without going
# through Checked's own Sync now button.
#
# Requires two secrets configured in the repo:
#   • CRON_SECRET — same value as the Vercel env var, so the
#                    /api/cron/godaddy-sync route accepts our request
#   • SITE_URL   — https://onchecked.app (or wherever prod lives).
#                    Optional; if unset we fall back to the marketing
#                    domain literal.
#
# GitHub Actions minute allowance on the free tier is 2000/month.
# Every run of this workflow is ~10s (one curl), so 4 runs/hour ×
# 720 hours/month ≈ 480 minutes — well within the free tier even
# with headroom for other workflows.
# ----------------------------------------------------------------

name: godaddy-sync

on:
  schedule:
    # Every 15 minutes. GitHub's own cron scheduling has ~5-min
    # jitter on shared infrastructure; effective cadence lands
    # between 10 and 20 min between runs. Fine for a retail
    # dashboard where nobody notices sub-15-min lag.
    - cron: '*/15 * * * *'
  # Manual "Run workflow" button in the Actions tab.
  workflow_dispatch:

# Never let two runs race the same endpoint. If a previous run
# is still in flight when the schedule fires again, drop the new
# one — the endpoint is idempotent and skipping a tick is fine.
concurrency:
  group: godaddy-sync
  cancel-in-progress: false

jobs:
  poke:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Hit /api/cron/godaddy-sync
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          SITE_URL: ${{ secrets.SITE_URL || 'https://onchecked.app' }}
        run: |
          set -e
          if [ -z "$CRON_SECRET" ]; then
            echo "::error::CRON_SECRET secret is not set on this repo. Add it in Settings → Secrets and variables → Actions."
            exit 1
          fi
          # -sS  = silent but show errors
          # --fail-with-body = non-zero exit on 4xx/5xx while still printing the body
          # -w   = extra stats line after the body so we log the response time + status
          # -o   = capture body to a temp file so we can assert on it
          # NOTE: no -L. If the endpoint 3xx-redirects (e.g. because
          #   proxy.ts starts bouncing machine routes to /login
          #   again), the workflow should FAIL loud rather than
          #   silently follow the redirect and report success.
          #
          # Retry transient network failures IN-RUN so a single blip
          # (e.g. `curl: (35) Recv failure: Connection reset by peer`,
          # which failed run #176) auto-recovers instead of skipping
          # that whole sync tick and emailing a failure:
          #   --retry 4              up to 4 extra attempts
          #   --retry-delay 5        wait 5s between attempts
          #   --retry-all-errors     retry ANY error, incl. 5xx + resets
          #   --retry-connrefused    also retry a refused connection
          #   --connect-timeout 15   cap the TCP/TLS handshake per attempt
          #   --max-time 60          cap each whole attempt
          # Only the FINAL attempt's outcome decides pass/fail: if a
          # retry succeeds, curl exits 0 with the winning HTTP_STATUS
          # and the strict 200 check below still runs; if all attempts
          # fail, curl's non-zero exit trips `set -e` and the job fails.
          RESPONSE_FILE=$(mktemp)
          HTTP_STATUS=$(curl -sS --fail-with-body \
            --retry 4 --retry-delay 5 --retry-all-errors --retry-connrefused \
            --connect-timeout 15 --max-time 60 \
            -H "Authorization: Bearer $CRON_SECRET" \
            -H "Accept: application/json" \
            -o "$RESPONSE_FILE" \
            -w "%{http_code}" \
            "$SITE_URL/api/cron/godaddy-sync")
          echo "---"
          cat "$RESPONSE_FILE"
          echo ""
          echo "---"
          echo "status=$HTTP_STATUS"
          # Explicit 200 check — catches the 3xx-redirect trap where
          # --fail-with-body treats a redirect as success and reports
          # a healthy exit code even though the sync never ran.
          if [ "$HTTP_STATUS" != "200" ]; then
            echo "::error::Expected HTTP 200 from cron endpoint, got $HTTP_STATUS"
            exit 1
          fi
